[project]
name = "auth-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.0",
    "annotated-types==0.7.0",
    "anyio==4.7.0",
    "asyncpg==0.30.0",
    "backoff==2.2.1",
    "certifi==2024.12.14",
    "cffi==1.17.1",
    "click==8.1.7",
    "concurrent-log-handler>=0.9.29",
    "cryptography==44.0.0",
    "dnspython==2.7.0",
    "email-validator==2.2.0",
    "fastapi==0.115.6",
    "greenlet==3.1.1",
    "gunicorn==23.0.0",
    "h11==0.14.0",
    "httpcore==1.0.7",
    "httpx==0.28.1",
    "idna==3.10",
    "mako==1.3.8",
    "markupsafe==3.0.2",
    "opentelemetry-api==1.29.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "opentelemetry-instrumentation-redis==0.50b0",
    "opentelemetry-instrumentation-sqlalchemy==0.50b0",
    "opentelemetry-sdk==1.29.0",
    "packaging==24.2",
    "passlib==1.7.4",
    "psycopg>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pycparser==2.22",
    "pydantic==2.10.3",
    "pydantic-core==2.27.1",
    "pydantic-settings==2.6.1",
    "pyjwt==2.10.1",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.19",
    "pyyaml==6.0.2",
    "redis==5.2.1",
    "setuptools==75.6.0",
    "sniffio==1.3.1",
    "sqlalchemy==2.0.36",
    "starlette==0.41.3",
    "typer>=0.26.7",
    "typing-extensions==4.12.2",
    "ua-parser==1.0.0",
    "user-agents==2.2.0",
    "uvicorn==0.32.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.12.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".venv", "__pycache__", "build", "dist", "old", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
